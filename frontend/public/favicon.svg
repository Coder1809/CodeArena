<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#0f0f1a"/>
  <!-- Left sword blade -->
  <line x1="18" y1="46" x2="36" y2="14" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <!-- Left sword guard -->
  <line x1="24" y1="38" x2="32" y2="42" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left sword pommel -->
  <circle cx="17" cy="48" r="2.5" fill="#863bff"/>
  <!-- Right sword blade -->
  <line x1="46" y1="46" x2="28" y2="14" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <!-- Right sword guard -->
  <line x1="40" y1="38" x2="32" y2="42" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right sword pommel -->
  <circle cx="47" cy="48" r="2.5" fill="#863bff"/>
  <!-- Center clash spark -->
  <circle cx="32" cy="26" r="3" fill="#c4b5fd" opacity="0.9"/>
  <circle cx="32" cy="26" r="6" fill="#863bff" opacity="0.25"/>
</svg>